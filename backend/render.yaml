services:
  - type: web
    name: interview-platform-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CLIENT_URL, sync: false }
      - { key: AI_PROVIDER, value: gemini }
      - { key: AI_API_KEY, sync: false }
      - { key: AI_MODEL, value: gemini-3.5-flash-lite }
